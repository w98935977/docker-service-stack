name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Validate Python syntax
        run: python3 -m py_compile app/main.py

      - name: Validate shell syntax
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for stack health
        run: ./scripts/wait_for_stack.sh

      - name: Exercise API
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS -X POST http://localhost:8080/events/ci-smoke-test
          curl -fsS http://localhost:8080/events | grep -q 'ci-smoke-test'

      - name: Backup PostgreSQL
        run: ./scripts/backup_postgres.sh

      - name: Restore PostgreSQL
        run: |
          backup_file="$(ls -1t backups/*.sql.gz | head -n1)"
          printf 'y\n' | ./scripts/restore_postgres.sh "$backup_file"

      - name: Verify stack after restore
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/events | grep -q 'ci-smoke-test'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Clean up
        if: always()
        run: docker compose down -v
